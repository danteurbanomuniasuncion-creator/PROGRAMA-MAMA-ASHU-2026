<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa General Mama Ashu 2026</title>
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Script de StPageFlip vía CDN -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Encabezado Simplificado */
        header {
            width: 100%;
            padding: 15px 30px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .logo-title i {
            color: #fbbf24;
        }

        /* Contenedor Principal */
        .magazine-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 75vh;
            padding: 20px;
            position: relative;
        }

        #flipbook {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            margin: 0 auto;
        }

        /* Estilo de Páginas e Imágenes */
        .page {
            background-color: #ffffff;
            overflow: hidden;
        }

        .page-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* DISEÑO DE LA TAPA PRINCIPAL Y CONTRAPORTADA */
        .page-cover {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            color: white;
            position: relative;
        }

        .cover-border {
            width: 100%;
            height: 100%;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            border: 2px solid rgba(251, 191, 36, 0.4);
            outline: 1px solid rgba(251, 191, 36, 0.2);
            outline-offset: -10px;
        }

        .cover-header {
            margin-top: 15px;
        }

        .cover-tag {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fbbf24;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .cover-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .cover-emblem {
            font-size: 3rem;
            color: #fbbf24;
            margin: 20px 0;
            filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.4));
        }

        .cover-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: #e2e8f0;
            letter-spacing: 1px;
        }

        .cover-footer {
            margin-bottom: 15px;
        }

        .cover-location {
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 400;
            letter-spacing: 2px;
        }

        /* Barra de Controles Inferior */
        .toolbar {
            width: 100%;
            padding: 15px 30px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
            z-index: 10;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .page-indicator {
            font-size: 0.95rem;
            color: #cbd5e1;
            font-weight: 600;
            min-width: 120px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Elemento de Audio -->
    <audio id="bgMusic" loop preload="auto">
        <source src="./musica.mp3" type="audio/mpeg">
    </audio>

    <!-- Encabezado -->
    <header>
        <div class="logo-title">
            <i class="fa-solid fa-crown"></i>
            <span>Programa Oficial Mama Ashu 2026</span>
        </div>
    </header>

    <!-- Contenedor del Libro -->
    <div class="magazine-container">
        <div id="flipbook">
            
            <!-- TAPA PRINCIPAL (PORTADA) -->
            <!-- Nota: Si prefieres usar una imagen en lugar de este diseño HTML, borra el div "cover-border" y pon: <img src="./paginas/portada.JPG" class="page-img"> -->
            <div class="page page-cover" data-density="hard">
                <div class="cover-border">
                    <div class="cover-header">
                        <p class="cover-tag">Programa Oficial</p>
                        <h1 class="cover-title">FIESTA PATRONAL</h1>
                    </div>
                    
                    <div class="cover-emblem">
                        <i class="fa-solid fa-church"></i>
                    </div>

                    <div class="cover-footer">
                        <h2 class="cover-subtitle">MAMA ASHU 2026</h2>
                        <p class="cover-location">ASUNCIÓN - CHACAS</p>
                    </div>
                </div>
            </div>

            <!-- Las 21 Páginas del Programa -->
            <div class="page"><img src="./paginas/pagina_01.JPG" class="page-img" alt="Página 1"></div>
            <div class="page"><img src="./paginas/pagina_02.JPG" class="page-img" alt="Página 2"></div>
            <div class="page"><img src="./paginas/pagina_03.JPG" class="page-img" alt="Página 3"></div>
            <div class="page"><img src="./paginas/pagina_04.JPG" class="page-img" alt="Página 4"></div>
            <div class="page"><img src="./paginas/pagina_05.JPG" class="page-img" alt="Página 5"></div>
            <div class="page"><img src="./paginas/pagina_06.JPG" class="page-img" alt="Página 6"></div>
            <div class="page"><img src="./paginas/pagina_07.JPG" class="page-img" alt="Página 7"></div>
            <div class="page"><img src="./paginas/pagina_08.JPG" class="page-img" alt="Página 8"></div>
            <div class="page"><img src="./paginas/pagina_09.JPG" class="page-img" alt="Página 9"></div>
            <div class="page"><img src="./paginas/pagina_10.JPG" class="page-img" alt="Página 10"></div>
            <div class="page"><img src="./paginas/pagina_11.JPG" class="page-img" alt="Página 11"></div>
            <div class="page"><img src="./paginas/pagina_12.JPG" class="page-img" alt="Página 12"></div>
            <div class="page"><img src="./paginas/pagina_13.JPG" class="page-img" alt="Página 13"></div>
            <div class="page"><img src="./paginas/pagina_14.JPG" class="page-img" alt="Página 14"></div>
            <div class="page"><img src="./paginas/pagina_15.JPG" class="page-img" alt="Página 15"></div>
            <div class="page"><img src="./paginas/pagina_16.JPG" class="page-img" alt="Página 16"></div>
            <div class="page"><img src="./paginas/pagina_17.JPG" class="page-img" alt="Página 17"></div>
            <div class="page"><img src="./paginas/pagina_18.JPG" class="page-img" alt="Página 18"></div>
            <div class="page"><img src="./paginas/pagina_19.JPG" class="page-img" alt="Página 19"></div>
            <div class="page"><img src="./paginas/pagina_20.JPG" class="page-img" alt="Página 20"></div>
            <div class="page"><img src="./paginas/pagina_21.JPG" class="page-img" alt="Página 21"></div>

            <!-- CONTRAPORTADA -->
            <div class="page page-cover" data-density="hard">
                <div class="cover-border">
                    <div class="cover-header">
                        <p class="cover-tag">¡Viva la Virgen de la Asunción!</p>
                    </div>
                    <div class="cover-emblem">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="cover-footer">
                        <h2 class="cover-subtitle">MAMA ASHU 2026</h2>
                        <p class="cover-location">Chacas - Ancash - Perú</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Toolbar Inferior -->
    <div class="toolbar">
        <button class="tool-btn" id="btnPrev">
            <i class="fa-solid fa-chevron-left"></i> Anterior
        </button>

        <span class="page-indicator" id="pageIndicator">Página 1</span>

        <button class="tool-btn" id="btnNext">
            Siguiente <i class="fa-solid fa-chevron-right"></i>
        </button>

        <button class="tool-btn" id="btnFullscreen">
            <i class="fa-solid fa-expand"></i> Pantalla Completa
        </button>
    </div>

    <script>
        window.addEventListener('load', function() {
            try {
                const flipbookElement = document.getElementById('flipbook');
                if (!flipbookElement) return;

                const pageFlip = new St.PageFlip(flipbookElement, {
                    width: 450,
                    height: 600,
                    size: "stretch",
                    minWidth: 300,
                    maxWidth: 600,
                    minHeight: 400,
                    maxHeight: 800,
                    drawShadow: true,
                    showCover: true,
                    usePortrait: true,
                    maxShadowOpacity: 0.8,
                    mobileScrollSupport: true
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                const bgMusic = document.getElementById('bgMusic');
                const btnPrev = document.getElementById('btnPrev');
                const btnNext = document.getElementById('btnNext');
                const btnFullscreen = document.getElementById('btnFullscreen');
                const pageIndicator = document.getElementById('pageIndicator');

                // Lógica de Audio Automático
                function startAudio() {
                    if (bgMusic && bgMusic.paused) {
                        bgMusic.play().then(() => {
                            // Audio iniciado, eliminamos los escuchadores globales
                            removeAudioListeners();
                        }).catch(() => {
                            // Si el navegador bloquea la reproducción sin interacción previa,
                            // esperará al primer clic/toque del usuario.
                        });
                    }
                }

                function removeAudioListeners() {
                    document.removeEventListener('click', startAudio);
                    document.removeEventListener('touchstart', startAudio);
                }

                // Intenta reproducir de inmediato al cargar
                startAudio();

                // Si se bloquea, se reproduce con el primer clic o toque en cualquier parte de la pantalla
                document.addEventListener('click', startAudio);
                document.addEventListener('touchstart', startAudio);

                // Controles de Navegación del Flipbook
                if (btnPrev) btnPrev.addEventListener('click', () => pageFlip.flipPrev());
                if (btnNext) btnNext.addEventListener('click', () => pageFlip.flipNext());

                pageFlip.on('flip', (e) => {
                    const current = e.data + 1;
                    const total = pageFlip.getPageCount();
                    if (pageIndicator) pageIndicator.textContent = `Página ${current} de ${total}`;
                });

                pageFlip.on('init', () => {
                    const total = pageFlip.getPageCount();
                    if (pageIndicator) pageIndicator.textContent = `Página 1 de ${total}`;
                });

                if (btnFullscreen) {
                    btnFullscreen.addEventListener('click', () => {
                        if (!document.fullscreenElement) {
                            document.documentElement.requestFullscreen();
                        } else if (document.exitFullscreen) {
                            document.exitFullscreen();
                        }
                    });
                }
            } catch (err) {
                console.error("Error al iniciar flipbook:", err);
            }
        });
    </script>
</body>
</html>
