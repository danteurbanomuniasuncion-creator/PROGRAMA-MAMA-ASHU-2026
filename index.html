<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa General Mama Ashu 2026</title>
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Script de StPageFlip vía CDN -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Encabezado */
        header {
            width: 100%;
            padding: 15px 30px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .logo-title i {
            color: #6366f1;
        }

        /* Reproductor de Audio */
        .audio-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .audio-btn {
            background: #6366f1;
            border: none;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
        }

        .audio-btn:hover {
            background: #4f46e5;
            transform: scale(1.05);
        }

        .audio-info {
            font-size: 0.85rem;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
        }

        .audio-title {
            font-weight: 600;
            color: #fff;
        }

        /* Contenedor Principal */
        .magazine-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 75vh;
            padding: 20px;
            position: relative;
        }

        #flipbook {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            margin: 0 auto;
        }

        /* Estilo de Páginas e Imágenes */
        .page {
            background-color: #ffffff;
            overflow: hidden;
        }

        .page-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .page-cover {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: white;
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            color: #f8fafc;
        }

        .page-content h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .page-content p {
            color: #c7d2fe;
            font-size: 1rem;
        }

        /* Barra de Controles Inferior */
        .toolbar {
            width: 100%;
            padding: 15px 30px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
            z-index: 10;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .page-indicator {
            font-size: 0.95rem;
            color: #cbd5e1;
            font-weight: 600;
            min-width: 120px;
            text-align: center;
        }

        /* Overlay de Bienvenida */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .start-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            max-width: 440px;
            width: 90%;
        }

        .start-card i.main-icon {
            font-size: 3.5rem;
            color: #818cf8;
            margin-bottom: 20px;
        }

        .start-card h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: #f8fafc;
        }

        .start-card p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .start-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .start-btn:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Overlay de Bienvenida -->
    <div class="start-overlay" id="startOverlay">
        <div class="start-card">
            <i class="fa-solid fa-book-open main-icon"></i>
            <h2>¡Bienvenido al Programa General!</h2>
            <p>Mama Ashu 2026 - Asunción, Chacas</p>
            <button class="start-btn" id="btnStart">
                <i class="fa-solid fa-play"></i> Abrir Revista
            </button>
        </div>
    </div>

    <!-- Elemento de Audio -->
    <audio id="bgMusic" loop preload="auto">
        <source src="./musica.mp3" type="audio/mpeg">
    </audio>

    <!-- Encabezado -->
    <header>
        <div class="logo-title">
            <i class="fa-solid fa-book-open"></i>
            <span>Programa Mama Ashu 2026</span>
        </div>

        <div class="audio-control">
            <button class="audio-btn" id="btnAudioToggle" title="Reproducir / Pausar Música">
                <i class="fa-solid fa-volume-xmark" id="audioIcon"></i>
            </button>
            <div class="audio-info">
                <span class="audio-title">Música de Fondo</span>
                <span id="audioStatus" style="font-size: 0.75rem; color: #94a3b8;">Pausado</span>
            </div>
        </div>
    </header>

    <!-- Contenedor del Libro -->
    <div class="magazine-container">
        <div id="flipbook">
            <!-- Portada Frontal -->
            <div class="page page-cover" data-density="hard">
                <div class="page-content">
                    <h1>PROGRAMA GENERAL</h1>
                    <p>Mama Ashu 2026</p>
                </div>
            </div>

            <!-- Las 21 Páginas del Programa -->
            <div class="page"><img src="./paginas/pagina_01.JPG" class="page-img" alt="Página 1"></div>
            <div class="page"><img src="./paginas/pagina_02.JPG" class="page-img" alt="Página 2"></div>
            <div class="page"><img src="./paginas/pagina_03.JPG" class="page-img" alt="Página 3"></div>
            <div class="page"><img src="./paginas/pagina_04.JPG" class="page-img" alt="Página 4"></div>
            <div class="page"><img src="./paginas/pagina_05.JPG" class="page-img" alt="Página 5"></div>
            <div class="page"><img src="./paginas/pagina_06.JPG" class="page-img" alt="Página 6"></div>
            <div class="page"><img src="./paginas/pagina_07.JPG" class="page-img" alt="Página 7"></div>
            <div class="page"><img src="./paginas/pagina_08.JPG" class="page-img" alt="Página 8"></div>
            <div class="page"><img src="./paginas/pagina_09.JPG" class="page-img" alt="Página 9"></div>
            <div class="page"><img src="./paginas/pagina_10.JPG" class="page-img" alt="Página 10"></div>
            <div class="page"><img src="./paginas/pagina_11.JPG" class="page-img" alt="Página 11"></div>
            <div class="page"><img src="./paginas/pagina_12.JPG" class="page-img" alt="Página 12"></div>
            <div class="page"><img src="./paginas/pagina_13.JPG" class="page-img" alt="Página 13"></div>
            <div class="page"><img src="./paginas/pagina_14.JPG" class="page-img" alt="Página 14"></div>
            <div class="page"><img src="./paginas/pagina_15.JPG" class="page-img" alt="Página 15"></div>
            <div class="page"><img src="./paginas/pagina_16.JPG" class="page-img" alt="Página 16"></div>
            <div class="page"><img src="./paginas/pagina_17.JPG" class="page-img" alt="Página 17"></div>
            <div class="page"><img src="./paginas/pagina_18.JPG" class="page-img" alt="Página 18"></div>
            <div class="page"><img src="./paginas/pagina_19.JPG" class="page-img" alt="Página 19"></div>
            <div class="page"><img src="./paginas/pagina_20.JPG" class="page-img" alt="Página 20"></div>
            <div class="page"><img src="./paginas/pagina_21.JPG" class="page-img" alt="Página 21"></div>

            <!-- Contraportada -->
            <div class="page page-cover" data-density="hard">
                <div class="page-content">
                    <h2>¡MAMA ASHU 2026!</h2>
                    <p>Asunción - Chacas</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toolbar Inferior -->
    <div class="toolbar">
        <button class="tool-btn" id="btnPrev">
            <i class="fa-solid fa-chevron-left"></i> Anterior
        </button>

        <span class="page-indicator" id="pageIndicator">Página 1</span>

        <button class="tool-btn" id="btnNext">
            Siguiente <i class="fa-solid fa-chevron-right"></i>
        </button>

        <button class="tool-btn" id="btnFullscreen">
            <i class="fa-solid fa-expand"></i> Pantalla Completa
        </button>
    </div>

    <script>
        window.addEventListener('load', function() {
            try {
                const flipbookElement = document.getElementById('flipbook');
                if (!flipbookElement) return;

                const pageFlip = new St.PageFlip(flipbookElement, {
                    width: 450,
                    height: 600,
                    size: "stretch",
                    minWidth: 300,
                    maxWidth: 600,
                    minHeight: 400,
                    maxHeight: 800,
                    drawShadow: true,
                    showCover: true,
                    usePortrait: true,
                    maxShadowOpacity: 0.8,
                    mobileScrollSupport: true
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                const bgMusic = document.getElementById('bgMusic');
                const btnAudioToggle = document.getElementById('btnAudioToggle');
                const audioIcon = document.getElementById('audioIcon');
                const audioStatus = document.getElementById('audioStatus');
                const startOverlay = document.getElementById('startOverlay');
                const btnStart = document.getElementById('btnStart');
                const btnPrev = document.getElementById('btnPrev');
                const btnNext = document.getElementById('btnNext');
                const btnFullscreen = document.getElementById('btnFullscreen');
                const pageIndicator = document.getElementById('pageIndicator');

                let isPlaying = false;

                function toggleAudio() {
                    if (!bgMusic) return;
                    if (isPlaying) {
                        bgMusic.pause();
                        if (audioIcon) audioIcon.className = 'fa-solid fa-volume-xmark';
                        if (audioStatus) audioStatus.textContent = 'Pausado';
                        isPlaying = false;
                    } else {
                        bgMusic.play().then(() => {
                            if (audioIcon) audioIcon.className = 'fa-solid fa-volume-high';
                            if (audioStatus) audioStatus.textContent = 'Reproduciendo';
                            isPlaying = true;
                        }).catch(err => console.log('Audio no iniciado:', err));
                    }
                }

                if (btnStart) {
                    btnStart.addEventListener('click', function() {
                        if (startOverlay) {
                            startOverlay.style.opacity = '0';
                            setTimeout(() => {
                                startOverlay.style.display = 'none';
                            }, 500);
                        }
                        toggleAudio();
                    });
                }

                if (btnAudioToggle) btnAudioToggle.addEventListener('click', toggleAudio);
                if (btnPrev) btnPrev.addEventListener('click', () => pageFlip.flipPrev());
                if (btnNext) btnNext.addEventListener('click', () => pageFlip.flipNext());

                pageFlip.on('flip', (e) => {
                    const current = e.data + 1;
                    const total = pageFlip.getPageCount();
                    if (pageIndicator) pageIndicator.textContent = `Página ${current} de ${total}`;
                });

                pageFlip.on('init', () => {
                    const total = pageFlip.getPageCount();
                    if (pageIndicator) pageIndicator.textContent = `Página 1 de ${total}`;
                });

                if (btnFullscreen) {
                    btnFullscreen.addEventListener('click', () => {
                        if (!document.fullscreenElement) {
                            document.documentElement.requestFullscreen();
                        } else if (document.exitFullscreen) {
                            document.exitFullscreen();
                        }
                    });
                }
            } catch (err) {
                console.error("Error al iniciar flipbook:", err);
            }
        });
    </script>
</body>
</html>
